AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    # RuboCop reads AllCops/Exclude from the TOPMOST .rubocop.yml it finds, so a
    # plain "worktree/**/*" here would also exclude every file of every git
    # worktree under worktree/<slug> (AGENTS.md hard rule 1). Rooting the pattern
    # at the working directory excludes the worktrees only when run from the
    # root checkout. ENV["PWD"] rather than Dir.pwd on purpose: RuboCop
    # evaluates this file with the process cwd set to the config's own
    # directory, so Dir.pwd is always the root and would re-swallow the
    # worktrees (verified; see docs/diary.md, 2026-08-29).
    - "<%= ENV.fetch("PWD") { Dir.pwd } %>/worktree/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
